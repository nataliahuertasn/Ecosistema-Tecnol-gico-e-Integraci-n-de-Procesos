<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ES-METALS · Ecosistema Tecnológico</title>
  <meta name="description" content="Cadena de valor de ES-METALS soportada por sistemas de información.">
  <link rel="icon" href="assets/img/logo-esmetals-vertical.png">

  <!-- El diseño, el motor y el contenido se piden siempre frescos, para que un
       cambio en contenido.js se vea de inmediato y no la versión guardada por el
       navegador. Al abrir el archivo con doble clic (file://) se cargan normal. -->
  <script>
    window.ESM_FRESCO = (location.protocol === 'http:' || location.protocol === 'https:')
      ? '?t=' + Date.now() : '';
    document.write('<link rel="stylesheet" href="assets/css/estilos.css' + window.ESM_FRESCO + '">');
  </script>
  <noscript><link rel="stylesheet" href="assets/css/estilos.css"></noscript>
</head>
<body>

  <!-- Fondo decorativo -->
  <div class="fondo" aria-hidden="true">
    <div class="fondo-halo fondo-halo--a"></div>
    <div class="fondo-halo fondo-halo--b"></div>
    <div class="fondo-malla"></div>
    <canvas id="lienzo-red"></canvas>
  </div>

  <!-- Barra de progreso -->
  <div class="progreso" aria-hidden="true"><span id="progreso-barra"></span></div>

  <!-- Barra superior -->
  <header class="barra" id="barra">
    <a class="barra-marca" href="#" id="ir-inicio" title="Volver a la portada">
      <img id="barra-logo" src="assets/img/logo-esmetals.png" alt="ES-METALS">
      <span class="barra-grupo" id="barra-grupo"></span>
    </a>

    <nav class="barra-nav" id="barra-nav" aria-label="Secciones"></nav>

    <div class="barra-acciones">
      <button class="boton-icono" id="btn-presentacion" title="Modo presentación (P)" aria-label="Modo presentación">
        <svg viewBox="0 0 24 24"><path d="M3 5h18v11H3z"/><path d="M12 16v3"/><path d="M8.5 21h7"/></svg>
      </button>
      <button class="boton-icono" id="btn-pantalla" title="Pantalla completa (F)" aria-label="Pantalla completa">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <!-- Láminas -->
  <main class="escenario" id="escenario"></main>

  <!-- Controles de navegación -->
  <nav class="controles" id="controles" aria-label="Navegación de la presentación">
    <button class="boton-nav" id="btn-anterior" aria-label="Anterior">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="controles-puntos" id="controles-puntos"></div>
    <span class="controles-contador" id="controles-contador"></span>
    <button class="boton-nav" id="btn-siguiente" aria-label="Siguiente">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>

  <!-- Panel lateral de detalle -->
  <div class="velo" id="velo"></div>
  <aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-titulo" aria-hidden="true">
    <button class="panel-cerrar" id="panel-cerrar" aria-label="Cerrar">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
    </button>
    <div class="panel-cuerpo" id="panel-cuerpo"></div>
  </aside>

  <!-- Aviso si el contenido no carga -->
  <noscript><p style="color:#fff;padding:40px">Esta presentación requiere JavaScript habilitado.</p></noscript>

  <script>
    /* Se escriben en este orden, igual que etiquetas normales, de modo que
       contenido.js siempre se ejecuta antes que app.js. */
    (function () {
      var v = window.ESM_FRESCO || '';
      document.write('<scr' + 'ipt src="contenido/contenido.js' + v + '"><\/scr' + 'ipt>');
      document.write('<scr' + 'ipt src="assets/js/app.js' + v + '"><\/scr' + 'ipt>');
    })();
  </script>
  <noscript>
    <script src="contenido/contenido.js"></script>
    <script src="assets/js/app.js"></script>
  </noscript>
</body>
</html>
